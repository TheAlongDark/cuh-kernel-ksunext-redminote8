name: Cuh KernelSU-Next Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Sistem Paketlerini Güncelle
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Derleyicileri İndir (Proton Clang & Android GCC)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-32

    - name: Cuh Kernel Kaynak Kodlarını Çek
      run: |
        git clone --depth=1 https://github.com/tejas101k/kernel_xiaomi_ginkgo.git -b thirteen kernel
        cd kernel
        rm -rf drivers/kernelsu

    - name: KernelSU-Next Sürücülerini Enjekte Et
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Çekirdeği (Kernel) Derle
      run: |
        cd kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc-64/bin:$GITHUB_WORKSPACE/gcc-32/bin:$PATH
        make O=out ARCH=arm64 vendor/ginkgo-perf_defconfig
        make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        
    - name: AnyKernel3 ile Flaşlanabilir Zip Oluştur
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || cp kernel/out/arch/arm64/boot/Image AnyKernel/
        cd AnyKernel
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../Cuh-KernelSU-Next-Ginkgo.zip *

    - name: Derlenen Kernel'ı İndirme Bağlantısı Yap
      uses: actions/upload-artifact@v4
      with:
        name: Cuh-KernelSU-Next-Zip
        path: Cuh-KernelSU-Next-Ginkgo.zip
