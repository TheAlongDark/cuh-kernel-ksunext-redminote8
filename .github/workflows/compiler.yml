name: Cuh KernelSU-Next Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Sistem Paketlerini Güncelle
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Proton Clang Derleyicisini İndir
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Cuh Kernel Kaynak Kodlarını Çek ve Onar
      run: |
        git clone --depth=1 https://github.com/tejas101k/kernel_xiaomi_ginkgo.git -b thirteen kernel
        cd kernel
        rm -rf drivers/kernelsu
        
        # Uyumsuz polly ve mllvm bayraklarını içeren TÜM satırları temizle
        find . -type f -name "Makefile" -exec sed -i '/polly/Id' {} +
        find . -type f -name "Makefile" -exec sed -i '/-mllvm/d' {} +

    - name: KernelSU-Next Sürücülerini Enjekte Et
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Çekirdeği (Kernel) Derle
      run: |
        cd kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        make O=out ARCH=arm64 vendor/ginkgo-perf_defconfig
        # CLANG_TRIPLE parametresi eksiksiz şekilde eklendi
        make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
    - name: AnyKernel3 ile Flaşlanabilir Zip Oluştur
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || cp kernel/out/arch/arm64/boot/Image AnyKernel/
        cd AnyKernel
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../Cuh-KernelSU-Next-Ginkgo.zip *

    - name: Derlenen Kernel'ı İndirme Bağlantısı Yap
      uses: actions/upload-artifact@v4
      with:
        name: Cuh-KernelSU-Next-Zip
        path: Cuh-KernelSU-Next-Ginkgo.zip
